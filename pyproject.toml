[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemical-category-scorer"
version = "2.0.0"
description = "Validated local-first chemical category scorers for desktop and Python library use."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy",
  "rdkit",
]

[project.urls]
Homepage = "https://github.com/phdgil/chemical-category-scorer"
Repository = "https://github.com/phdgil/chemical-category-scorer"

[project.scripts]
chemical-category-scorer = "chemical_category_scorer.cli:main"
chemical-category-scorer-desktop = "app.desktop_app:main"

[tool.setuptools]
packages = ["chemical_category_scorer", "app"]
include-package-data = false

[tool.setuptools.package-data]
app = [
  "data/app_release_config.json",
  "data/cross_category_calibration.json",
  "data/AAA_logo.png",
  "data/models/han_endocrine_disruptors.json",
  "data/models/final_flavor_fragrance.json",
  "data/models/final_pesticides.json",
  "data/models/final_surfactants.json",
  "data/model_refs/*.csv",
]
